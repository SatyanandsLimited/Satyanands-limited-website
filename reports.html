<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports — Satyanand's Limited</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fbf8ef;color:#222}.head{background:#fff;border-bottom:2px solid #c9a227;padding:16px;text-align:center}.head img{width:80px;height:80px;object-fit:contain}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.box{background:#fff;border:1px solid #e5d9b9;border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 6px 20px #0000000d}.gold{color:#9b7a0c}.input{width:100%;padding:11px;border:1px solid #cfc4a7;border-radius:10px;margin:6px 0 10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;margin:4px}.primary{background:#171717;color:#fff}.goldbtn{background:#c9a227}.danger{background:#eee}.notice{padding:12px;background:#fff7dc;border-left:4px solid #c9a227;line-height:1.5}.login{max-width:440px;margin:60px auto}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}@media(max-width:700px){.filters{grid-template-columns:1fr}.table{overflow:auto}}</style></head><body>
<div class="head"><img src="logo.png" alt="Logo"><h1>Sales Reports</h1><div>Satyanand's Limited • Est. 2024</div></div>
<div id="login" class="login box"><h2>Owner Login</h2><input id="pw" class="input" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Unlock Reports</button><p id="err"></p></div>
<main id="app" class="wrap" style="display:none"><div class="box"><div class="filters"><label>From<input id="from" class="input" type="date"></label><label>To<input id="to" class="input" type="date"></label><label>Status<select id="status" class="input"><option value="all">All</option><option value="completed">Completed</option><option value="order-sent">Order sent</option></select></label><button class="btn primary" onclick="run()">Run Report</button></div></div>
<div class="box"><div id="summary" class="notice"></div><div class="table" id="table"></div><button class="btn goldbtn" onclick="exportReport()">Export Report</button></div></main>
<script src="product.js"></script><script>
let store;
function login(){store=SATYANANDS_LOAD();if(document.getElementById('pw').value!==store.settings.adminPassword){document.getElementById('err').textContent='Incorrect password.';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';defaults();run()}
function defaults(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),mm=String(m+1).padStart(2,'0');document.getElementById('from').value=`${y}-${mm}-01`;document.getElementById('to').value=`${y}-${mm}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`}
function e(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return 'TT$'+Number(n||0).toFixed(2)}
function run(){let sales=Array.isArray(store.sales)?store.sales:[],from=document.getElementById('from').value,to=document.getElementById('to').value,status=document.getElementById('status').value;sales=sales.filter(s=>{let d=String(s.date||'').slice(0,10);return(!from||d>=from)&&(!to||d<=to)&&(status==='all'||s.status===status)});let taxable=0,vat=0,zero=0,total=0;sales.forEach(s=>{taxable+=+s.taxable||0;vat+=+s.vat||0;zero+=+s.zeroRated||0;total+=+s.total||0});document.getElementById('summary').innerHTML=`<b>${sales.length} sale/order record(s)</b><br>Amount taxable: <b>${money(taxable)}</b> &nbsp; VAT: <b>${money(vat)}</b> &nbsp; Zero-rated: <b>${money(zero)}</b> &nbsp; Final total: <b>${money(total)}</b>`;document.getElementById('table').innerHTML=sales.length?`<table style="width:100%;border-collapse:collapse;margin-top:14px"><tr><th>Date</th><th>Customer</th><th>Status</th><th>Taxable</th><th>VAT</th><th>Zero-rated</th><th>Total</th></tr>${sales.map(s=>`<tr><td>${e(String(s.date||'').slice(0,10))}</td><td>${e(s.customerName)}</td><td>${e(s.status)}</td><td>${money(s.taxable)}</td><td>${money(s.vat)}</td><td>${money(s.zeroRated)}</td><td>${money(s.total)}</td></tr>`).join('')}</table>`:'<p>No records for this period.</p>'}
function exportReport(){let data={business:"Satyanand's Limited",from:document.getElementById('from').value,to:document.getElementById('to').value,status:document.getElementById('status').value,sales:store.sales||[]};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='satyanands-sales-report.json';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
